<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title description"><title id="title">SEQ266 held-identifier supplied-text comparison</title><desc id="description">One seed. Full supervision reaches 30 of 32 pairs with text, versus one loss-off and two baseline. All states reach zero pairs without text. Full covers 15 of 16 worlds, failing the every-world gate.</desc><rect x="0" y="0" width="1200" height="640" fill="white" /><text x="55" y="43" font-size="25" fill="#263442" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, sans-serif">SEQ266: text-supported held-identifier transfer</text><text x="55" y="72" font-size="14" fill="#263442" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, sans-serif">One training seed | Same topology family | No automatic checkpoint promotion</text><rect x="838" y="53" width="307" height="34" rx="5" fill="#fff0e8" /><text x="991" y="76" font-size="15" fill="#923619" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, sans-serif">Engineering conjunction: FAIL</text><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M-1,1 l2,-2 M0,6 l6,-6 M5,7 l2,-2" stroke="#384653" stroke-width="1" /></pattern></defs><rect x="55" y="102" width="19" height="16" fill="#667988" /><text x="84" y="115" font-size="13" fill="#263442" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, sans-serif">OWN_TEXT: actual stored EVENT text</text><rect x="395" y="102" width="19" height="16" fill="url(#hatch)" stroke="#384653" /><text x="424" y="115" font-size="13" fill="#263442" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, sans-serif">UNAVAILABLE: stored text withheld</text><text x="53" y="168" font-size="17" fill="#263442" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, sans-serif">A  Strict opposite-goal pairs</text><line x1="68" y1="466" x2="370" y2="466" stroke="#dbe1e5" stroke-width="1" /><text x="59" y="470" font-size="11" fill="#63717c" text-anchor="end" font-weight="normal" font-family="DejaVu Sans, sans-serif">0%</text><line x1="68" y1="403.5" x2="370" y2="403.5" stroke="#dbe1e5" stroke-width="1" /><text x="59" y="407.5" font-size="11" fill="#63717c" text-anchor="end" font-weight="normal" font-family="DejaVu Sans, sans-serif">25%</text><line x1="68" y1="341.0" x2="370" y2="341.0" stroke="#dbe1e5" stroke-width="1" /><text x="59" y="345.0" font-size="11" fill="#63717c" text-anchor="end" font-weight="normal" font-family="DejaVu Sans, sans-serif">50%</text><line x1="68" y1="278.5" x2="370" y2="278.5" stroke="#dbe1e5" stroke-width="1" /><text x="59" y="282.5" font-size="11" fill="#63717c" text-anchor="end" font-weight="normal" font-family="DejaVu Sans, sans-serif">75%</text><line x1="68" y1="216" x2="370" y2="216" stroke="#dbe1e5" stroke-width="1" /><text x="59" y="220" font-size="11" fill="#63717c" text-anchor="end" font-weight="normal" font-family="DejaVu Sans, sans-serif">100%</text><rect x="91" y="450.375" width="28" height="15.625" fill="#74818f" stroke="#74818f" stroke-width="1" /><text x="105" y="442.375" font-size="12" fill="#263442" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">2/32</text><rect x="126" y="466.0" width="28" height="0.0" fill="url(#hatch)" stroke="#74818f" stroke-width="1" /><text x="140" y="458.0" font-size="12" fill="#263442" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">0/32</text><text x="122" y="492" font-size="13" fill="#263442" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">Baseline</text><rect x="191" y="458.1875" width="28" height="7.8125" fill="#bd7539" stroke="#bd7539" stroke-width="1" /><text x="205" y="450.1875" font-size="12" fill="#263442" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">1/32</text><rect x="226" y="466.0" width="28" height="0.0" fill="url(#hatch)" stroke="#bd7539" stroke-width="1" /><text x="240" y="458.0" font-size="12" fill="#263442" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">0/32</text><text x="222" y="492" font-size="13" fill="#263442" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">Loss-off</text><rect x="291" y="231.625" width="28" height="234.375" fill="#286789" stroke="#286789" stroke-width="1" /><text x="305" y="223.625" font-size="12" fill="#263442" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, sans-serif">30/32</text><rect x="326" y="466.0" width="28" height="0.0" fill="url(#hatch)" stroke="#286789" stroke-width="1" /><text x="340" y="458.0" font-size="12" fill="#263442" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, sans-serif">0/32</text><text x="322" y="492" font-size="13" fill="#263442" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">Full</text><text x="438" y="168" font-size="17" fill="#263442" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, sans-serif">B  Individual goals</text><line x1="453" y1="466" x2="755" y2="466" stroke="#dbe1e5" stroke-width="1" /><text x="444" y="470" font-size="11" fill="#63717c" text-anchor="end" font-weight="normal" font-family="DejaVu Sans, sans-serif">0%</text><line x1="453" y1="403.5" x2="755" y2="403.5" stroke="#dbe1e5" stroke-width="1" /><text x="444" y="407.5" font-size="11" fill="#63717c" text-anchor="end" font-weight="normal" font-family="DejaVu Sans, sans-serif">25%</text><line x1="453" y1="341.0" x2="755" y2="341.0" stroke="#dbe1e5" stroke-width="1" /><text x="444" y="345.0" font-size="11" fill="#63717c" text-anchor="end" font-weight="normal" font-family="DejaVu Sans, sans-serif">50%</text><line x1="453" y1="278.5" x2="755" y2="278.5" stroke="#dbe1e5" stroke-width="1" /><text x="444" y="282.5" font-size="11" fill="#63717c" text-anchor="end" font-weight="normal" font-family="DejaVu Sans, sans-serif">75%</text><line x1="453" y1="216" x2="755" y2="216" stroke="#dbe1e5" stroke-width="1" /><text x="444" y="220" font-size="11" fill="#63717c" text-anchor="end" font-weight="normal" font-family="DejaVu Sans, sans-serif">100%</text><rect x="476" y="337.09375" width="28" height="128.90625" fill="#74818f" stroke="#74818f" stroke-width="1" /><text x="490" y="329.09375" font-size="12" fill="#263442" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">33/64</text><rect x="511" y="454.28125" width="28" height="11.71875" fill="url(#hatch)" stroke="#74818f" stroke-width="1" /><text x="525" y="446.28125" font-size="12" fill="#263442" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">3/64</text><text x="507" y="492" font-size="13" fill="#263442" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">Baseline</text><rect x="576" y="364.4375" width="28" height="101.5625" fill="#bd7539" stroke="#bd7539" stroke-width="1" /><text x="590" y="356.4375" font-size="12" fill="#263442" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">26/64</text><rect x="611" y="466.0" width="28" height="0.0" fill="url(#hatch)" stroke="#bd7539" stroke-width="1" /><text x="625" y="458.0" font-size="12" fill="#263442" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">0/64</text><text x="607" y="492" font-size="13" fill="#263442" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">Loss-off</text><rect x="676" y="223.8125" width="28" height="242.1875" fill="#286789" stroke="#286789" stroke-width="1" /><text x="690" y="215.8125" font-size="12" fill="#263442" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, sans-serif">62/64</text><rect x="711" y="376.15625" width="28" height="89.84375" fill="url(#hatch)" stroke="#286789" stroke-width="1" /><text x="725" y="368.15625" font-size="12" fill="#263442" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, sans-serif">23/64</text><text x="707" y="492" font-size="13" fill="#263442" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">Full</text><text x="823" y="168" font-size="17" fill="#263442" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, sans-serif">C  Worlds with a correct pair</text><text x="823" y="190" font-size="12" fill="#263442" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, sans-serif">OWN_TEXT only; every world is required</text><line x1="838" y1="466" x2="1140" y2="466" stroke="#dbe1e5" stroke-width="1" /><text x="829" y="470" font-size="11" fill="#63717c" text-anchor="end" font-weight="normal" font-family="DejaVu Sans, sans-serif">0%</text><line x1="838" y1="403.5" x2="1140" y2="403.5" stroke="#dbe1e5" stroke-width="1" /><text x="829" y="407.5" font-size="11" fill="#63717c" text-anchor="end" font-weight="normal" font-family="DejaVu Sans, sans-serif">25%</text><line x1="838" y1="341.0" x2="1140" y2="341.0" stroke="#dbe1e5" stroke-width="1" /><text x="829" y="345.0" font-size="11" fill="#63717c" text-anchor="end" font-weight="normal" font-family="DejaVu Sans, sans-serif">50%</text><line x1="838" y1="278.5" x2="1140" y2="278.5" stroke="#dbe1e5" stroke-width="1" /><text x="829" y="282.5" font-size="11" fill="#63717c" text-anchor="end" font-weight="normal" font-family="DejaVu Sans, sans-serif">75%</text><line x1="838" y1="216" x2="1140" y2="216" stroke="#dbe1e5" stroke-width="1" /><text x="829" y="220" font-size="11" fill="#63717c" text-anchor="end" font-weight="normal" font-family="DejaVu Sans, sans-serif">100%</text><line x1="838" y1="216" x2="1140" y2="216" stroke="#923619" stroke-width="1.5" stroke-dasharray="5,4" /><text x="1138" y="206" font-size="12" fill="#923619" text-anchor="end" font-weight="normal" font-family="DejaVu Sans, sans-serif">Required: 16/16</text><rect x="878" y="434.75" width="28" height="31.25" fill="#74818f" stroke="#74818f" stroke-width="1" /><text x="892" y="426.75" font-size="12" fill="#263442" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">2/16</text><text x="892" y="492" font-size="13" fill="#263442" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">Baseline</text><rect x="978" y="450.375" width="28" height="15.625" fill="#bd7539" stroke="#bd7539" stroke-width="1" /><text x="992" y="442.375" font-size="12" fill="#263442" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">1/16</text><text x="992" y="492" font-size="13" fill="#263442" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">Loss-off</text><rect x="1078" y="231.625" width="28" height="234.375" fill="#286789" stroke="#286789" stroke-width="1" /><text x="1092" y="250.625" font-size="12" fill="white" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, sans-serif">15/16</text><text x="1092" y="492" font-size="13" fill="#263442" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, sans-serif">Full</text><rect x="45" y="528" width="1110" height="92" rx="5" fill="#f3f6f8" /><text x="59" y="552" font-size="12" fill="#263442" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, sans-serif">Four presentations/trajectory; 1,452 new terse targets; 2,928 updates/fit. Old W0/W8 and audit: 16/16 in every state.</text><text x="59" y="576" font-size="12" fill="#263442" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, sans-serif">All 32 pairs and 16 worlds retained. The preexisting invalid EVENT remains: no exclusions or repaired source.</text><text x="59" y="600" font-size="12" fill="#263442" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, sans-serif">No error bars: one training seed. Not a rich-supervision, new parametric-memory, or H1/H2 result.</text></svg>
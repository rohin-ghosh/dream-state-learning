[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "structmem-bench"
version = "0.1.0"
description = "A psychology-grounded, memory-type-agnostic retention benchmark for continual LLM-agent memory (working name; rename pending). Abstract CPU tier: numpy-only."
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# LLM tier (GPU): real memory backends + a small agent model
llm = [
    "torch>=2.3",
    "transformers>=4.45",
    "peft>=0.12",
    "sentence-transformers>=3.0",
]

[tool.setuptools]
packages = ["structmem_bench"]
